name: Sync skill submodules

# Points plugins/* at each skill repo's latest commit. Each skill repo sends a
# skill-updated dispatch on push to main (its notify-skills workflow).
on:
  repository_dispatch:
    types: [skill-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Bump submodules
        run: |
          git submodule update --remote
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump skill submodules"
          git push
